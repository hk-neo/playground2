<svg width="750" height="400" viewBox="0 0 750 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="750" height="400" fill="#ffffff" />

  <!-- Headers -->
  <rect x="50" y="20" width="280" height="40" rx="5" fill="#f1f3f5" />
  <text x="190" y="45" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">단위 테스트 (빠름, 격리)</text>

  <rect x="420" y="20" width="280" height="40" rx="5" fill="#f1f3f5" />
  <text x="560" y="45" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">통합 테스트 (느림, 실제 환경)</text>

  <!-- Unit Test Box -->
  <rect x="50" y="70" width="280" height="240" rx="8" fill="#e3f9e5" stroke="#28a745" stroke-width="2"/>
  <text x="70" y="100" font-family="Arial" font-size="13" font-weight="bold" fill="#155724">각 클래스 로직 검증</text>
  <line x1="65" y1="110" x2="315" y2="110" stroke="#28a745" stroke-width="1" stroke-dasharray="2,2"/>
  
  <g font-family="Courier New" font-size="12" fill="#155724">
    <text x="70" y="135">StateManager</text>
    <text x="70" y="155">ComponentRegistry</text>
    <text x="70" y="175">OrbitalCamera</text>
    <text x="70" y="195">Measurement Tools</text>
    <text x="70" y="215">Overlay Renderer</text>
    <text x="70" y="235">Security Module</text>
    <text x="70" y="255">...</text>
  </g>

  <text x="190" y="335" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#28a745">200+ tests</text>
  <text x="190" y="355" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#28a745">&lt; 1초</text>

  <!-- Integration Test Box -->
  <rect x="420" y="70" width="280" height="240" rx="8" fill="#fff5f5" stroke="#dc3545" stroke-width="2"/>
  <text x="440" y="100" font-family="Arial" font-size="13" font-weight="bold" fill="#721c24">전체 파이프라인 동작 검증</text>
  <line x1="435" y1="110" x2="685" y2="110" stroke="#dc3545" stroke-width="1" stroke-dasharray="2,2"/>

  <g font-family="Arial" font-size="12" fill="#721c24">
    <text x="440" y="135">DICOM Load → Volume</text>
    <text x="440" y="155">Volume → MPR Rendering</text>
    <text x="440" y="175">Volume → 3D Ray Casting</text>
    <text x="440" y="195">Mouse → Camera Rotation</text>
    <text x="440" y="215">Scroll → Slice Change</text>
    <text x="440" y="235">Drag → WL/WW Change</text>
    <text x="440" y="255">...</text>
  </g>

  <text x="560" y="335" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc3545">10+ scenarios</text>
  <text x="560" y="355" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc3545">~30초</text>

  <!-- Comparison Arrow -->
  <path d="M 330 190 L 420 190" stroke="#adb5bd" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="375" y="180" font-family="Arial" font-size="11" text-anchor="middle" fill="#6c757d">커버리지 보완</text>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#adb5bd" />
    </marker>
  </defs>
</svg>
