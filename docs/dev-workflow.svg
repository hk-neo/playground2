<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#ffffff" />

  <!-- Phases Headers -->
  <text x="100" y="30" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Phase 0</text>
  <text x="300" y="30" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Phase 1: PA</text>
  <text x="500" y="30" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Phase 2: EA</text>
  <text x="700" y="30" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Phase 3: 구현</text>
  
  <line x1="50" y1="40" x2="750" y2="40" stroke="#ccc" stroke-width="1" />

  <!-- Main Gate Boxes -->
  <rect x="40" y="60" width="120" height="50" rx="5" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
  <text x="100" y="80" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">프로젝트</text>
  <text x="100" y="95" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">초기화</text>

  <rect x="240" y="60" width="120" height="50" rx="5" fill="#e7f4ff" stroke="#007bff" stroke-width="2"/>
  <text x="300" y="80" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">PA Gate</text>
  <text x="300" y="95" font-family="Arial" font-size="10" text-anchor="middle">!create-subs</text>

  <rect x="440" y="60" width="120" height="50" rx="5" fill="#e7f4ff" stroke="#007bff" stroke-width="2"/>
  <text x="500" y="80" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">EA Gate</text>
  <text x="500" y="95" font-family="Arial" font-size="10" text-anchor="middle">!create-subs</text>

  <rect x="640" y="60" width="120" height="50" rx="5" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="700" y="80" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">구현 반복</text>
  <text x="700" y="95" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">루프</text>

  <!-- Arrows between Gates -->
  <path d="M 160 85 L 240 85" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 360 85 L 440 85" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 560 85 L 640 85" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Sub-steps Phase 1 -->
  <rect x="225" y="140" width="70" height="50" rx="3" fill="#fff" stroke="#666" stroke-dasharray="4"/>
  <text x="260" y="160" font-family="Arial" font-size="10" text-anchor="middle">IU Doc</text>
  <text x="260" y="175" font-family="Arial" font-size="10" text-anchor="middle" fill="#007bff">!gen</text>

  <rect x="305" y="140" width="70" height="50" rx="3" fill="#fff" stroke="#666" stroke-dasharray="4"/>
  <text x="340" y="160" font-family="Arial" font-size="10" text-anchor="middle">SyRS Doc</text>

  <path d="M 300 110 L 300 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 300 130 L 260 130 L 260 140" stroke="#666" stroke-width="1.5" fill="none"/>
  <path d="M 300 130 L 340 130 L 340 140" stroke="#666" stroke-width="1.5" fill="none"/>

  <!-- Sub-steps Phase 2 -->
  <rect x="425" y="140" width="70" height="50" rx="3" fill="#fff" stroke="#666" stroke-dasharray="4"/>
  <text x="460" y="160" font-family="Arial" font-size="10" text-anchor="middle">RMR Doc</text>

  <rect x="505" y="140" width="70" height="50" rx="3" fill="#fff" stroke="#666" stroke-dasharray="4"/>
  <text x="540" y="160" font-family="Arial" font-size="10" text-anchor="middle">SRS Doc</text>

  <path d="M 500 110 L 500 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 500 130 L 460 130 L 460 140" stroke="#666" stroke-width="1.5" fill="none"/>
  <path d="M 500 130 L 540 130 L 540 140" stroke="#666" stroke-width="1.5" fill="none"/>

  <!-- Command Description Box -->
  <rect x="240" y="220" width="320" height="50" rx="5" fill="#f1f3f5" stroke="#dee2e6"/>
  <text x="250" y="238" font-family="Arial" font-size="10" fill="#495057">!create-subs → IU, SR 티켓 생성</text>
  <text x="250" y="255" font-family="Arial" font-size="10" fill="#495057">!generate → 문서 자동 생성</text>

  <!-- Phase 3 Details -->
  <rect x="630" y="140" width="65" height="40" rx="3" fill="#fff" stroke="#666" stroke-dasharray="4"/>
  <text x="662" y="165" font-family="Arial" font-size="10" text-anchor="middle">!plan</text>

  <rect x="705" y="140" width="65" height="40" rx="3" fill="#fff" stroke="#666" stroke-dasharray="4"/>
  <text x="737" y="160" font-family="Arial" font-size="10" text-anchor="middle">!trace-</text>
  <text x="737" y="172" font-family="Arial" font-size="10" text-anchor="middle">ability</text>

  <path d="M 700 110 L 700 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 700 130 L 662 130 L 662 140" stroke="#666" stroke-width="1.5" fill="none"/>
  <path d="M 700 130 L 737 130 L 737 140" stroke="#666" stroke-width="1.5" fill="none"/>

  <rect x="640" y="210" width="120" height="80" rx="5" fill="#fffbe6" stroke="#ffe58f"/>
  <text x="700" y="230" font-family="Arial" font-size="11" text-anchor="middle" font-weight="bold">!implement</text>
  <text x="650" y="250" font-family="Arial" font-size="10">코드 작성</text>
  <text x="650" y="265" font-family="Arial" font-size="10">테스트 수행</text>
  <text x="650" y="280" font-family="Arial" font-size="10">Git 커밋</text>

  <path d="M 700 180 L 700 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Phase 0 Details -->
  <text x="40" y="320" font-family="Courier New" font-size="11" fill="#666">setup_project.py</text>
  <text x="40" y="340" font-family="Courier New" font-size="11" fill="#666">.env 설정</text>
  <text x="40" y="360" font-family="Courier New" font-size="11" fill="#666">.claude/commands/</text>
  
  <path d="M 100 110 L 100 300" stroke="#999" stroke-width="1" fill="none" stroke-dasharray="2"/>

  <!-- Return Loop -->
  <path d="M 700 290 L 700 400 L 100 400 L 100 110" stroke="#dee2e6" stroke-width="2" fill="none"/>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
  </defs>
</svg>
