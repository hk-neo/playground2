<svg width="700" height="450" viewBox="0 0 700 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="700" height="450" fill="#ffffff" />
  
  <!-- Outer Boundary -->
  <rect x="20" y="20" width="660" height="410" rx="10" fill="#fcfcfc" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="350" y="45" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">테스트 실행 흐름</text>

  <!-- Vitest Box -->
  <rect x="60" y="80" width="220" height="120" rx="5" fill="#e3f9e5" stroke="#28a745" stroke-width="2"/>
  <text x="170" y="105" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#155724">Vitest (단위 테스트)</text>
  <line x1="70" y1="115" x2="270" y2="115" stroke="#28a745" stroke-width="1"/>
  <text x="80" y="140" font-family="Arial" font-size="12" fill="#155724">• jsdom 환경</text>
  <text x="80" y="160" font-family="Arial" font-size="12" fill="#155724">• 모듈별 단위테스트</text>
  <text x="80" y="180" font-family="Arial" font-size="12" fill="#155724">• 200+ tests</text>

  <!-- Puppeteer Box -->
  <rect x="420" y="80" width="220" height="120" rx="5" fill="#fff5f5" stroke="#dc3545" stroke-width="2"/>
  <text x="530" y="105" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#721c24">Puppeteer (통합 테스트)</text>
  <line x1="430" y1="115" x2="630" y2="115" stroke="#dc3545" stroke-width="1"/>
  <text x="440" y="140" font-family="Arial" font-size="12" fill="#721c24">• Headless Chrome</text>
  <text x="440" y="160" font-family="Arial" font-size="12" fill="#721c24">• 실제 WebGL2 렌더링</text>
  <text x="440" y="180" font-family="Arial" font-size="12" fill="#721c24">• 스크린샷 캡처</text>

  <!-- Vite Dev Server Box -->
  <rect x="200" y="260" width="300" height="130" rx="8" fill="#f0f7ff" stroke="#007bff" stroke-width="2"/>
  <text x="350" y="285" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#004085">Vite Dev Server</text>
  <text x="350" y="305" font-family="Arial" font-size="12" text-anchor="middle" fill="#004085">(localhost:5175, HMR)</text>
  <line x1="220" y1="315" x2="480" y2="315" stroke="#007bff" stroke-width="1" stroke-dasharray="2,2"/>
  
  <text x="350" y="345" font-family="Arial" font-size="12" text-anchor="middle" fill="#004085">src/ ──► TypeScript ──► JS</text>
  <text x="350" y="370" font-family="Arial" font-size="12" text-anchor="middle" fill="#004085">public/dicom-test/ ──► HTTP</text>

  <!-- Arrows -->
  <path d="M 530 200 L 530 260" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="540" y="235" font-family="Arial" font-size="12" fill="#333">서버 접속</text>

  <path d="M 170 200 L 170 230 L 350 230 L 350 260" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="260" y="225" font-family="Arial" font-size="11" fill="#666">환경 설정 공유</text>

  <!-- Arrowhead definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
  </defs>
</svg>
