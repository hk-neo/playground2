<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>@neobiotech/cbct-cpr - plain ESM example</title>
  <style>
    body { font-family: ui-monospace, monospace; margin: 2rem; }
    canvas { border: 1px solid #888; image-rendering: pixelated; }
    #status { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>CPR plain-ESM example</h1>
  <p id="status">loading...</p>
  <canvas id="output"></canvas>

  <!--
    No bundler: serve the repository root (e.g. `npx vite` or
    `python3 -m http.server`) and open this page. The library is loaded
    straight from dist/, which must have been built with `npm run build`.

    All dist files (index.js, engine.js, cpr.js, cpr.wasm, cpr-worker.js)
    must stay in the same directory so import.meta.url resolution works.
  -->
  <script type="module">
    import { createCprEngine } from '../../dist/index.js';

    const status = document.getElementById('status');
    const canvas = document.getElementById('output');

    const dimensions = [160, 160, 40];
    const spacing = [0.3, 0.3, 0.5];
    const data = new Int16Array(dimensions[0] * dimensions[1] * dimensions[2]);
    for (let z = 0; z < dimensions[2]; z++) {
      for (let y = 0; y < dimensions[1]; y++) {
        for (let x = 0; x < dimensions[0]; x++) {
          const ring = Math.abs(Math.hypot(x - 80, y - 80) - 55) < 5 ? 900 : 0;
          const bar = x > 70 && x < 90 && y > 30 && y < 130 ? 400 : 0;
          data[z * dimensions[0] * dimensions[1] + y * dimensions[0] + x] = ring + bar + z * 2;
        }
      }
    }

    const curve = {
      points: [
        { x: 20, y: 80, z: 0 },
        { x: 80, y: 110, z: 0 },
        { x: 140, y: 80, z: 0 },
      ],
      sample(t) {
        const u = Math.min(1, Math.max(0, t));
        const [a, b, c] = this.points;
        const v = 1 - u;
        return {
          x: v * v * a.x + 2 * v * u * b.x + u * u * c.x,
          y: v * v * a.y + 2 * v * u * b.y + u * u * c.y,
          z: 0,
        };
      },
    };

    try {
      const engine = await createCprEngine();
      await engine.setVolume({ data, dimensions, spacing });
      const result = await engine.extract(curve, {
        thickness: 12,
        pixelSize: 0.4,
        mode: 'mean',
      });

      let min = Infinity;
      let max = -Infinity;
      for (const value of result.data) {
        if (value < min) min = value;
        if (value > max) max = value;
      }
      const scale = max > min ? 255 / (max - min) : 0;
      const image = new ImageData(result.width, result.height);
      for (let i = 0; i < result.data.length; i++) {
        const gray = Math.round((result.data[i] - min) * scale);
        image.data[i * 4] = gray;
        image.data[i * 4 + 1] = gray;
        image.data[i * 4 + 2] = gray;
        image.data[i * 4 + 3] = 255;
      }
      canvas.width = result.width;
      canvas.height = result.height;
      canvas.getContext('2d').putImageData(image, 0, 0);

      status.textContent =
        `backend: ${result.backend}`
        + (engine.fallbackReason ? ` (fallback: ${engine.fallbackReason})` : '')
        + `\nsize: ${result.width} x ${result.height}\nelapsed: ${result.elapsedMs.toFixed(1)} ms`;
      engine.dispose();
    } catch (error) {
      status.textContent = `CPR failed: ${error instanceof Error ? error.message : error}`;
    }
  </script>
</body>
</html>
